upstream azone {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 20M;

    location / {
        proxy_pass http://azone;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }
}
