{% comment %}
    Line chart drawn from wger.coach.charts.Chart. Hover behaviour: coach/_chart_script.html
{% endcomment %}
<figure class="coach-chart mb-4" id="{{ chart.id }}">
    <figcaption class="coach-chart-title">{{ chart.title }}</figcaption>
    {% if chart.is_empty %}
        <p class="coach-chart-empty">No entries yet. They show up here after your first check-in.</p>
    {% else %}
        {% if chart.legend|length > 1 %}
            <ul class="coach-chart-legend">
                {% for item in chart.legend %}
                    <li>
                        <svg width="18" height="10" aria-hidden="true">
                            {% if item.style == 'dots' %}
                                <circle cx="9" cy="5" r="4" class="mark-dot"></circle>
                            {% else %}
                                <line x1="1" y1="5" x2="17" y2="5" class="mark-{{ item.style }}"></line>
                            {% endif %}
                        </svg>
                        {{ item.label }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
        <div class="coach-chart-plot">
            <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img"
                 aria-label="{{ chart.title }} chart, latest {{ chart.end_label.label }}">
                {% for tick in chart.y_ticks %}
                    <line class="grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}"
                          y1="{{ tick.y }}" y2="{{ tick.y }}"></line>
                    <text class="axis" x="{{ chart.plot_left|add:'-8' }}" y="{{ tick.y }}"
                          text-anchor="end" dominant-baseline="middle">{{ tick.label }}</text>
                {% endfor %}
                {% for tick in chart.x_ticks %}
                    <text class="axis" x="{{ tick.x }}" y="{{ chart.height|add:'-8' }}"
                          text-anchor="middle">{{ tick.label }}</text>
                {% endfor %}
                {% if chart.reference %}
                    <line class="mark-target" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}"
                          y1="{{ chart.reference.y }}" y2="{{ chart.reference.y }}"></line>
                    <text class="axis" x="{{ chart.plot_right|add:'6' }}" y="{{ chart.reference.y }}"
                          dominant-baseline="middle">{{ chart.reference.label }}</text>
                {% endif %}
                {% for dot in chart.dots %}
                    <circle cx="{{ dot.x }}" cy="{{ dot.y }}" r="4" class="mark-dot"></circle>
                {% endfor %}
                {% for path in chart.paths %}
                    <path d="{{ path.d }}" class="mark-{{ path.style }}"></path>
                {% endfor %}
                <circle cx="{{ chart.end_label.x }}" cy="{{ chart.end_label.y }}" r="4.5"
                        class="mark-end"></circle>
                <text class="end-label" x="{{ chart.end_label.x|add:'10' }}" y="{{ chart.end_label.y }}"
                      dominant-baseline="middle">{{ chart.end_label.label }}</text>
                <line class="crosshair" y1="{{ chart.plot_top }}" y2="{{ chart.plot_bottom }}"
                      x1="0" x2="0" visibility="hidden"></line>
                <rect class="hit" x="{{ chart.plot_left }}" y="0"
                      width="{{ chart.plot_width }}" height="{{ chart.height }}"
                      fill="transparent"></rect>
            </svg>
            <div class="coach-chart-tooltip" hidden></div>
        </div>
        {{ chart.hover|json_script:chart.data_id }}
    {% endif %}
</figure>
